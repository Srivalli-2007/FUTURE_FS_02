<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini CRM Dashboard</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>🚀 Mini CRM Dashboard</h1>

<div class="header-buttons">

<button class="theme-btn" onclick="toggleTheme()">
🌙 Theme
</button>

<button class="export-btn" onclick="exportCSV()">
📥 Export
</button>

<button class="logout-btn" onclick="logout()">
Logout
</button>

</div>

</header>

<section class="stats">

<div class="card">
<h3>Total Leads</h3>
<p id="totalLeads">0</p>
</div>

<div class="card">
<h3>New</h3>
<p id="newLeads">0</p>
</div>

<div class="card">
<h3>Contacted</h3>
<p id="contactedLeads">0</p>
</div>

<div class="card">
<h3>Converted</h3>
<p id="convertedLeads">0</p>
</div>

</section>

<section class="form-section">

<h2>Add New Lead</h2>

<form id="leadForm">

<input type="text" id="name" placeholder="Lead Name" required>

<input type="email" id="email" placeholder="Email" required>

<input type="text" id="phone" placeholder="Phone">

<input type="text" id="source" placeholder="Lead Source">

<select id="status">

<option>New</option>
<option>Contacted</option>
<option>Converted</option>
<option>Lost</option>

</select>

<textarea id="notes" placeholder="Notes"></textarea>

<button type="submit" class="save-btn">
Save Lead
</button>

</form>

</section>

<section class="search-section">

<input
type="text"
id="search"
placeholder="Search by name or email">

<select id="filterStatus">

<option value="">All Status</option>

<option value="New">New</option>

<option value="Contacted">Contacted</option>

<option value="Converted">Converted</option>

<option value="Lost">Lost</option>

</select>

</section>

<div class="table-container">

<table>

<thead>

<tr>

<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Status</th>
<th>Source</th>
<th>Date</th>
<th>Actions</th>

</tr>

</thead>

<tbody id="leadTable">

</tbody>

</table>

</div>

<script src="js/app.js"></script>

</body>
</html>
